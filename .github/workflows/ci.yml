name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check --no-deps --index-url https://pypi.org/simple setuptools==84.1.0 wheel==0.48.0 packaging==26.3

      - name: Run synthetic source tests
        run: python -m unittest discover -s tests -v

      - name: Build wheel and source distribution
        run: python -I -B -c 'import setuptools.build_meta as b; b.build_sdist("dist"); b.build_wheel("dist")'

      - name: Install wheel in a clean temporary environment outside the checkout
        run: python scripts/smoke_installed.py
