name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Install script dry run (bash)
        if: runner.os != 'Windows'
        run: |
          out="$RUNNER_TEMP/dry"
          INSTALL_BIN_DIR="$out/bin" INSTALL_SHORTCUT_DIR="$out/shortcuts" bash install.sh --dry-run
          test ! -e "$out"

      - name: Install script dry run (cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "INSTALL_BIN_DIR=%RUNNER_TEMP%\dry\bin"
          set "INSTALL_SHORTCUT_DIR=%RUNNER_TEMP%\dry\shortcuts"
          call install.cmd /dry-run
          if exist "%RUNNER_TEMP%\dry" exit /b 1
