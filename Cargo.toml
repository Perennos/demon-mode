[package]
name = "demon-mode"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Perennos DEMON MODE: a local, advisory pace governor for Claude Code and Codex subscriptions."
license = "Apache-2.0"
repository = "https://github.com/Perennos/demon-mode"
readme = "README.md"
publish = false
include = ["src/**", "web/**", "brand/mark.svg", "brand/mark-light.svg", "brand/favicon.svg", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE"]

[lib]
name = "demon_mode"
path = "src/lib.rs"

[[bin]]
name = "demon"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
getrandom = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled", "collation"] }
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.0"
tiny_http = "0.12.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
