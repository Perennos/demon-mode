<!-- Hallmark · component: logo mark · genre: atmospheric · theme: custom (thermal heat scale on near-black) · pre-emit critique: P5 H4 E4 S5 R4 V5 -->
<title id="t">Perennos DEMON MODE mark: a grinning horned face as line art on a HUD reticle; the horns are the end stops of a tachometer needle resting at DEMON.</title>
<style>:root{--oxblood:#3B0A0A;--infrared:#E1261C;--ember:#FF7A1A;--blue:#2C6BFF;--whitehot:#FFF4E0;--base:#FBF6EC;--ink:#0A0A0B;--dim:rgba(10,10,11,.58);--track:rgba(10,10,11,.10);--scan:rgba(10,10,11,.045);--hot:#0A0A0B;--pointer:#0A0A0B;--glow:#E1261C;--lineink:#E1261C;--ease:cubic-bezier(.3,0,.1,1)}
.track{fill:none;stroke:var(--track);stroke-width:7}
.seg{fill:none;stroke-width:7;opacity:.5}
.seg.s4{opacity:1}
.tick{stroke:var(--dim);stroke-width:1.5}
.tick.major{stroke-width:2.5}
.ring{fill:none;stroke:var(--ink);stroke-width:7;opacity:.28}
.face{stroke:var(--hot);stroke-width:7}
.ptr{fill:var(--pointer);transform:rotate(56deg)}
.pglow{fill:var(--glow);transform:rotate(56deg);opacity:.9}
.hub{fill:var(--dim)}
.ptr,.pglow{transform:rotate(52deg)}</style>
